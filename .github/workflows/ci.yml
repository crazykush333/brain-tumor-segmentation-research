name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # tags are needed for the protocol-v1.0 regression checks
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check src tests scripts
      - name: Format check
        run: python -m ruff format --check src tests scripts
      - name: Type check
        run: python -m mypy
      - name: Tests (synthetic fixtures only)
        run: python -m pytest
      - name: Frozen protocol integrity
        run: brats-uncertainty verify-protocol
      - name: Prohibited files and secrets
        run: brats-uncertainty check-repo
      - name: Website data in sync with sources of truth
        run: brats-uncertainty export-site-data --check
      - name: Research gates are enforced (training must be blocked)
        run: |
          if brats-uncertainty check-action train_main; then
            echo "train_main unexpectedly authorized"; exit 1
          fi
      - name: Build package
        run: python -m build
