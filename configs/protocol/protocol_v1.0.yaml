# Machine-readable transcription of design parameters from the FROZEN protocol.
#
#   Authoritative source: docs/research/FINAL_RESEARCH_PROTOCOL_v1.0.md  (git tag protocol-v1.0)
#
# This file does NOT define the design; it mirrors it so that code can consume
# the parameters. If this file and the protocol ever disagree, the protocol wins
# and this file is wrong. tests/regression/test_frozen_protocol.py checks the
# protocol file hash and that every value below appears in the protocol text.
# Any change to the design requires a logged protocol amendment (protocol §25).

protocol:
  version: "v1.0"
  status: "frozen"
  frozen_on: "2026-09-28"
  git_tag: "protocol-v1.0"
  file: "docs/research/FINAL_RESEARCH_PROTOCOL_v1.0.md"
  sha256: "704c0b495917344f44b93e7548ade0e32a71220265419516a2c83d626fcd9811"   # SHA-256 of LF-normalized text = git blob at tag protocol-v1.0

modalities:
  channel_order: ["T1", "T1c", "T2", "FLAIR"]          # §8
  missing_value_after_normalization: 0.0                # §10: normalized channel set to 0

conditions:                                             # §10
  C5: ["Full", "-T1", "-T1c", "-T2", "-FLAIR"]
  C4: ["-T1", "-T1c", "-T2", "-FLAIR"]                  # primary H-W estimand subset; S7 population
  control: "Full"                                       # supporting/control; not in H-W; not used for tau
  C15_scope: {sets: ["internal_test"], arm: "B"}        # S10

modality_dropout:                                       # §10, arm B training policy
  p_full: 0.5
  other_subsets: "uniform over the 14 non-full, non-empty subsets"
  applied: "after augmentation"
  tuned: false

regions:                                                # §8 region mapping
  brats2021: {ET: [4], TC: [1, 4], WT: [1, 2, 4]}
  brats_africa_expected: {ET: [3], TC: [1, 3], WT: [1, 2, 3]}
  brats_africa_labels_verified_on_files: false           # gate C1

model:                                                  # §9
  framework: "nnU-Net v2"
  configuration: "3d_fullres"
  region_based: true
  epochs: 250
  save_every: 5
  seeds: [0, 1, 2]
  checkpoint: "checkpoint_final"
  inference: {sliding_window_step: 0.5, mirroring: false, threshold: 0.5}
  ensemble: "mean of the 3 members' sigmoid probabilities"
  arms:
    A: {modality_dropout: false}
    B: {modality_dropout: true}

cohorts:                                                # §5, §6
  brats2021_training_total: 1251
  hoi_site_id: "1"
  hoi_count: 511
  development_count_before_grouping: 740
  brats_africa_max_eligible: 95

grouping:                                               # §6.1–6.2
  verified_groups:
    A: ["BraTS2021_00626", "BraTS2021_00758"]
    B: ["BraTS2021_00639", "BraTS2021_00557"]
  t_screen_rule: "minimum WT-label Dice among the two verified positive-control pairs"
  t_screen_value: null          # computed once at gate B7; never set by hand
  linked_decisions: ["SAME_PATIENT", "UNRESOLVED"]
  primary_reviewer: "Ayush Kushwaha"
  second_reviewer: "Dr. Sreenivasa Chakravarthi"

split:                                                  # §6.3
  unit: "patient_group"
  proportions: {train: 0.70, validation: 0.10, internal_test: 0.20}
  seed: 20260927
  stratification: ["ET present in any member vs absent in all members", "tertile of mean member WT volume"]

uncertainty:                                            # §11
  U1: "mean pairwise Dice between the three members' binary masks (threshold 0.5); both empty -> 1"
  U2: "negative mean binary entropy of ensemble-mean probability within ROI (union of member masks dilated by 3 voxels); empty ROI -> entropy 0"
  U3: "single-model (seed 0) mean max-probability within the ROI"
  roi_dilation_voxels: 3
  I: "-(validation mean risk of the condition), same arm's ensemble"

metrics:
  risk: "1 - ET Dice"                                   # §3
  dice_empty_convention: {both_empty: 1.0, one_empty: 0.0}
  ece: {bins: 15, binning: "equal-width", roi_dilation_voxels: 3}   # S4
  volume_failure: {relative_error_threshold: 0.40, sensitivity_threshold: 0.65, min_gt_et_ml: 1.0}  # S5

statistics:                                             # §13–§15
  bootstrap_replicates: 10000
  bootstrap_seed: 12345
  bootstrap_unit: "patient_group"
  ci_level: 0.95
  ci_method: "percentile"
  ci_sensitivity: "BCa"
  alpha: 0.05
  p_value: "2 * min(P*(delta >= 0), P*(delta <= 0))"
  multiplicity: "Holm within family only; no global FWER claim"
  families:
    F1: "S1: DeltaAURC_c for the 4 C4 conditions, internal (4 tests)"
    F2: "S8: mean over C4 on UPenn and on BraTS-Africa (2 tests)"
    F3: "S7: Delta-risk at q = 0.80 on internal test, UPenn, BraTS-Africa (3 tests)"
    F3b: "S7: Delta-coverage at q = 0.80 on internal test, UPenn, BraTS-Africa (3 tests)"
    F4: "S2: TC and WT mean over C4 (2 tests)"
    F5: "S9: arm A DeltaAURC_c over C4 — descriptive only"

threshold_transfer:                                     # §4 S7
  q_primary: 0.80
  q_sensitivity: [0.70, 0.90]
  rule: "largest observed U1 value such that coverage(validation, U1 >= tau) >= q"
  population: "C4"
  condition_weighting: "equal"
  full_used_for_tau: false
  failure_analysis_q: 0.20                              # §19 confident failure (descriptive)

seeds:                                                  # §16
  training: [0, 1, 2]
  split: 20260927
  bootstrap: 12345
  figure_case_sampling: 7

compute:                                                # §17 (ESTIMATES until EXP-001)
  cap_gpu_hours: 220
