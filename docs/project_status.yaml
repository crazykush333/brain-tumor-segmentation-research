# Single source of truth for project state.
#
# Consumed by: the research-gate guards (src/brats_uncertainty/evaluation/guards.py),
# the README status line, and the website (exported to website/data/*.json by
# `brats-uncertainty export-site-data`). Never hand-edit website data.
#
# Rules (enforced by src/brats_uncertainty/evaluation/status.py):
#   - A gate may be CLOSED/PASSED only with committed evidence (inside the repository,
#     not git-ignored, in the git index) and a closed_on date; FAILED/BLOCKED B gates
#     need an evidence document. B1 evidence: docs/data/B1_EVIDENCE_<date>.md;
#     B2-B6 evidence: the gate's REAL_RESEARCH_DATA execution record (clean commit,
#     frozen protocol hash, linked to earlier gates' records).
#   - Only gate-A items may be OWNER_WAIVED.
#   - B gates close strictly in protocol order (B1 before B2 ...).
#   - B gates follow the lifecycle state machine (src/brats_uncertainty/evaluation/lifecycle.py):
#     LOCKED until every prerequisite has PASSED; PASSED only with committed,
#     non-synthetic execution-record evidence; change with `brats-uncertainty gate-transition`.
#   - data/training/evaluation/results must agree with the gates.
#   - results.available may be true only with evidence (results/index.json).

schema_version: 1
last_updated: "2026-09-30"
headline: "Protocol v1.0 frozen. Experimental execution pending."

project:
  title: "Case-level reliability of glioma segmentation under missing MRI sequences"
  short_title: "Reliability under missing MRI sequences"
  owner: "Ayush Kushwaha"
  type: "Pre-registered empirical evaluation study"
  research_question: >-
    When MRI sequences are missing at inference, does the case-level ensemble uncertainty
    of a modality-dropout nnU-Net discriminate unreliable enhancing-tumour segmentations
    within a given missing-sequence condition, i.e. beyond what the known identity of the
    missing sequence provides? How does this vary with which sequence is missing, and do
    the discrimination and operating thresholds transfer to a held-out institution and an
    external population?
  central_question: >-
    Among cases with the same missing sequence, can ensemble disagreement identify which
    cases are likely to fail?

