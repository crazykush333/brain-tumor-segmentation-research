recorded_for: Ayush Kushwaha (owner)
authority: >-
  Owner's written instruction of 2026-10-06 (OPTION A5 run order): after verified B12 run
  EXP-001, then "proceed to the six real training runs" (arm A standard nnU-Net and arm B
