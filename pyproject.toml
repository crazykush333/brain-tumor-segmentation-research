[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "brats-uncertainty"
version = "0.1.0"
description = "Research software for a pre-registered evaluation of case-level reliability of glioma segmentation under missing MRI sequences (protocol v1.0, frozen). No scientific results are included."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Ayush Kushwaha" }]
keywords = ["medical imaging", "brain tumour segmentation", "uncertainty", "missing modality", "pre-registration"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
# Figure generation (future; never for fabricated results).
viz = ["matplotlib>=3.8"]
# Reading real imaging / metadata files once data are legitimately acquired (gate B2).
io = ["nibabel>=5.2", "openpyxl>=3.1"]
# Training / inference backend (Kaggle/Colab only; not needed for tests).
nnunet = ["nnunetv2>=2.5", "torch>=2.2"]
dev = [
  "matplotlib>=3.8",
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.10",
  "types-PyYAML",
  "build>=1.2",
  "openpyxl>=3.1",   # tests exercise the real .xlsx crosswalk reader on synthetic workbooks
  "nibabel>=5.2",    # tests exercise the nnU-Net dataset writer on synthetic NIfTI volumes
]

[project.scripts]
brats-uncertainty = "brats_uncertainty.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
brats_uncertainty = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "slow: slower synthetic tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]
extend-exclude = ["website", "experiments/kaggle/*.ipynb"]  # notebooks are generated by scripts/remote/make_kaggle_notebooks.py (linted)

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PT"]
ignore = [
  "RUF001", "RUF002", "RUF003",  # scientific symbols (τ, Δ, −) are intentional
  "N802", "N803", "N806",        # scientific names (U1, I, ΔAURC) are intentional
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PT011", "PT018"]   # compact assertions are clearer in these tests

[tool.mypy]
files = ["src"]
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["nibabel.*", "openpyxl.*", "nnunetv2.*", "torch.*", "matplotlib.*", "scipy.*", "kagglehub.*", "kaggle_secrets.*"]
ignore_missing_imports = true
